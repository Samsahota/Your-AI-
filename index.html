<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25282D">
<title>Trans Haul · Haulage Portal (demo)</title>
<meta name="description" content="Offline demonstration of the Trans Haul management portal. Illustrative data; no live systems connected.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2325282D'/%3E%3Crect x='12' y='6' width='8' height='14' fill='%23ED1C24'/%3E%3Crect x='12' y='20' width='8' height='6' fill='%23F6EC3D'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Trans Haul · Haulage Portal — design system
   Spacing scale: 4 8 12 16 24 32
   ========================================================================== */
:root{
  --charcoal:#25282D; --charcoal-2:#1F2125; --charcoal-3:#34373C;
  --red:#ED1C24; --red-hover:#C9151C; --red-text:#B3141A; --red-soft:#FDEBEC;
  --yellow:#F6EC3D;
  --bg:#F4F4F2; --card:#FFFFFF; --line:#E5E4E0; --line-2:#EFEEEA;
  --text:#1D1D1B; --text-2:#3F3F3B; --muted:#6E6D68;
  --amber:#9A6200; --amber-soft:#FBF2DF; --amber-line:#EFD9A8;
  --teal:#1F6F6B; --teal-soft:#E3F2F0; --teal-line:#B9DDD8;
  --blue:#2D5B8A; --blue-soft:#E8EFF7;
  --r-card:12px; --r-ctl:8px;
  --shadow:0 1px 2px rgba(20,24,28,.05);
  --shadow-lg:0 12px 40px rgba(20,24,28,.18);
  --font:Figtree, Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .text-2{color:var(--text-2)}
.small{font-size:12px} .xs{font-size:11.5px}
.strong{font-weight:600}
.nowrap{white-space:nowrap}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
body.live .demo-only{display:none!important}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--line);background:#fff;color:var(--text);font-weight:550;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:#F2F4F6;border-color:#D5D9DE}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-hover);border-color:var(--red-hover)}
.btn-dark{background:var(--charcoal);border-color:var(--charcoal);color:#fff}
.btn-dark:hover{background:var(--charcoal-3)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:rgba(0,0,0,.05)}
.btn-sm{min-height:30px;padding:0 10px;font-size:13px}
.btn-lg{min-height:48px;padding:0 20px;font-size:15px}
.btn-block{width:100%}
.btn[disabled],.btn.is-disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;font-weight:550;text-decoration:none}
.link:hover{text-decoration:underline}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Pills / status ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent;background:var(--line-2);color:var(--text-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.plain::before{display:none}
.pill.ok{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.pill.warn{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.pill.bad{background:var(--red-soft);color:var(--red-text);border-color:#F6C6C8}
.pill.info{background:var(--blue-soft);color:var(--blue);border-color:#C9D8EA}
.pill.dark{background:var(--charcoal);color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.caveat{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-ctl);background:#F3F5F7;border:1px solid var(--line);color:var(--text-2);font-size:12.5px}
.caveat.warn{background:var(--amber-soft);border-color:var(--amber-line);color:#6E4700}
.caveat .icon{margin-top:1px}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:#1F2023;color:#D9DCE0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:20px 22px 18px}
.brand-mark{display:flex;flex-direction:column;line-height:1}
.brand-word{font-weight:800;letter-spacing:-.02em;font-size:17.5px;color:#fff}
.brand-word span{font-weight:500;opacity:.85}
.brand-sub{font-size:11px;color:#9AA1A9;margin-top:4px;letter-spacing:.02em}
.brand-flag{width:6px;height:30px;border-radius:2px;background:var(--red);position:relative;flex:none}
.brand-flag::after{content:"";position:absolute;left:0;bottom:0;width:6px;height:9px;background:var(--yellow);border-radius:0 0 2px 2px}
.nav{padding:10px 0;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav-item{display:flex;align-items:center;gap:13px;height:44px;padding:0 22px;color:#C9C8C4;text-decoration:none;font-weight:550;font-size:14.5px;position:relative}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:var(--red);color:#fff}
.nav-item.active::after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--yellow)}
.nbdg{margin-left:auto;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;border-radius:99px;min-width:22px;text-align:center;line-height:20px;padding:0 7px}
.nav-item.active .nbdg{background:#fff;color:var(--red-text)}
.mark{width:30px;height:30px;flex:none}
.nav-item .icon{width:18px;height:18px;opacity:.9}
.nav-foot{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#9AA1A9}
.nav-user{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;background:#E9EBEE;color:var(--charcoal);flex:none}
.avatar.dark{background:var(--charcoal-3);color:#fff}
.avatar.red{background:var(--red);color:#fff}
.nav-user .who{color:#fff;font-weight:600;font-size:13px;line-height:1.2}
.nav-user .role{font-size:11.5px;color:#9AA1A9}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px}
.menu-btn{display:none}
.disclosure{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);background:#F3F4F6;border:1px solid var(--line);height:26px;padding:0 10px;border-radius:999px;white-space:nowrap}
.disclosure i{width:6px;height:6px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 1px #C9BE1F inset}
.clock{font-size:12.5px;color:var(--muted);white-space:nowrap}
.search{position:relative;flex:1;max-width:440px;margin-left:auto}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:var(--r-ctl);background:#F7F8F9;padding:0 12px 0 34px}
.search input:focus{background:#fff;outline:none;border-color:#B8C0C9;box-shadow:0 0 0 3px rgba(45,91,138,.12)}
.search .icon{position:absolute;left:11px;top:10px;color:var(--muted)}
.search-results{position:absolute;left:0;right:0;top:42px;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-lg);max-height:420px;overflow:auto;padding:6px}
.sr-group{padding:8px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sr-item{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:6px;cursor:pointer;text-decoration:none}
.sr-item:hover,.sr-item.focus{background:#F2F4F6}
.content{padding:26px 32px 56px;max-width:1480px;width:100%}

/* ---------- Page ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-size:27px;line-height:1.15}
.page-head .sub{color:var(--muted);margin-top:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.crumbs a{color:var(--text-2);text-decoration:none;font-weight:550}
.crumbs a:hover{text-decoration:underline}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:42px;padding:0 12px;border:0;background:none;border-bottom:2px solid transparent;color:var(--text-2);font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--red)}
.tab .count{font-size:11.5px;background:var(--line-2);border-radius:999px;padding:1px 7px;color:var(--text-2)}
.section-title{font-size:17px;font-weight:650;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card-pad-lg{padding:24px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.card-head h3{font-size:15px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(300px,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}

/* ---------- KPIs ---------- */
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-label{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi-value{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi-value.sm{font-size:22px}
.kpi-meta{font-size:12.5px;color:var(--text-2)}
.kpi-link{appearance:none;border:1px solid transparent;background:none;text-align:left;padding:8px 10px;margin:-8px -10px;border-radius:8px;cursor:pointer;color:inherit;text-decoration:none;display:block;min-width:0}
.kpi-link:hover{background:#F4F6F8;border-color:var(--line)}
.kpi > .kpi-link{display:flex;flex-direction:column;gap:2px;margin-bottom:-4px}
.delta-bad{color:var(--red-text);font-weight:600}
.delta-ok{color:var(--teal);font-weight:600}
.delta-warn{color:var(--amber);font-weight:600}

/* ---------- Overview bands ---------- */
.bands{display:flex;flex-direction:column;gap:10px}
.band{display:grid;grid-template-columns:200px 1fr;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);min-height:104px}
.band-q{padding:14px 16px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;justify-content:center;gap:4px}
.band-q .qn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--charcoal);color:#fff;font-size:12px;font-weight:700}
.band-q h2{font-size:15px;line-height:1.25}
.band-q .when{font-size:12px;color:var(--muted)}
.band-body{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:center;gap:0}
.band-cell{padding:12px 18px;border-right:1px solid var(--line-2);min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center}
.band-cell:last-child{border-right:0}
.band-cell.wide{grid-column:span 2}
.meter{height:6px;background:var(--line-2);border-radius:999px;overflow:hidden;margin-top:6px;position:relative}
.meter > span{display:block;height:100%;background:var(--charcoal);border-radius:999px}
.meter.target::after{content:"";position:absolute;right:0;top:-2px;bottom:-2px;width:2px;background:var(--text-2)}
.cmp{display:grid;grid-template-columns:52px 1fr auto;gap:4px 8px;align-items:center;font-size:12px;margin-top:4px}
.cmp .bar{height:8px;border-radius:3px;background:#C9CED4}
.cmp .bar.actual{background:var(--charcoal)}
.cmp .bar.over{background:var(--charcoal);position:relative}
.cmp .lbl{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--text)}
.chip:hover{border-color:#C5CBD2;background:#F7F8F9}
.chip.bad{border-color:#F3C2C4;color:var(--red-text);background:#FFF7F7}
.chip.warn{border-color:var(--amber-line);color:var(--amber);background:#FFFBF3}
.chip.ok{border-color:var(--teal-line);color:var(--teal);background:#F5FBFA}
.chip.active{background:var(--charcoal);border-color:var(--charcoal);color:#fff}

/* ---------- Attention list ---------- */
.att{display:flex;flex-direction:column}
.att-item{display:grid;grid-template-columns:8px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line-2);text-decoration:none;color:inherit;cursor:pointer}
.att-item:first-child{border-top:0}
.att-item:hover{background:#FAFBFB}
.sev{width:8px;height:8px;border-radius:50%;background:#C2C8CF}
.sev.high{background:var(--red)} .sev.med{background:#D99A1E} .sev.low{background:#8D96A0} .sev.done{background:var(--teal)}
.att-title{font-weight:600}
.att-detail{font-size:12.5px;color:var(--text-2);margin-top:2px}
.att-group{padding:10px 16px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:#FAFBFB;border-top:1px solid var(--line-2)}
.feed{display:flex;flex-direction:column}
.feed-item{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--line-2)}
.feed-item:first-child{border-top:0}
.feed-item .avatar{width:28px;height:28px;font-size:11px}
.feed-time{font-size:11.5px;color:var(--muted)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.data th{position:sticky;top:0;background:#FAFBFB;text-align:left;font-weight:600;font-size:12px;color:var(--text-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--text)}
table.data th .arr{opacity:.5;margin-left:4px}
table.data td{padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr.clickable{cursor:pointer}
table.data tbody tr.clickable:hover td{background:#F9FAFB}
table.data tbody tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--red)}
table.data .num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.data tfoot td{font-weight:650;background:#FAFBFB;border-top:1px solid var(--line);border-bottom:0}
.id{font-weight:650;white-space:nowrap}
.sub-line{font-size:12px;color:var(--muted)}

/* ---------- Filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line-2)}
.input,.select,textarea.input{height:36px;border:1px solid var(--line);border-radius:var(--r-ctl);background:#fff;padding:0 10px;min-width:0}
textarea.input{height:auto;min-height:84px;padding:8px 10px;resize:vertical;width:100%}
.input:focus,.select:focus{outline:none;border-color:#A9B3BE;box-shadow:0 0 0 3px rgba(45,91,138,.12)}
.select{padding-right:28px}
.f-search{flex:1 1 240px;position:relative}
.f-search input{width:100%;padding-left:32px}
.f-search .icon{position:absolute;left:10px;top:10px;color:var(--muted)}
.f-date{display:flex;align-items:center;gap:6px}
.filter-summary{display:flex;gap:24px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line-2);background:#FCFCFD}
.filter-summary .kpi-value{font-size:20px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field .hint{font-size:12px;color:var(--muted)}
.field .err{font-size:12.5px;color:var(--red-text);font-weight:550}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px}
.field > .input,.field > .select,.field > select,.field > input,.field > textarea{width:100%;max-width:100%;min-width:0}
.select{text-overflow:ellipsis;max-width:100%}
.modal-body{min-width:0;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--charcoal)}
.radio-card{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-ctl);cursor:pointer;margin-bottom:8px}
.radio-card:hover{border-color:#C5CBD2}
.radio-card.sel{border-color:var(--charcoal);box-shadow:0 0 0 1px var(--charcoal)}
.radio-card input{accent-color:var(--charcoal);width:18px;height:18px;margin:0}
.switch{position:relative;display:inline-block;width:40px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#C9CED4;border-radius:999px;transition:.15s;cursor:pointer}
.switch span::before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.switch input:checked + span{background:var(--teal)}
.switch input:checked + span::before{transform:translateX(16px)}
.switch input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- Record pages ---------- */
.record-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.record-head h1{font-size:27px}
.record-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.pager{display:flex;gap:6px}
.kv{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:8px 16px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:550;min-width:0;overflow-wrap:anywhere}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-card);background:#fff;overflow:hidden}
.stat-row > div{padding:14px 16px;border-right:1px solid var(--line-2)}
.stat-row > div:last-child{border-right:0}
.callout{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:16px;border-radius:var(--r-card);background:#FFF8F0;border:1px solid var(--amber-line);flex-wrap:wrap}
.callout.good{background:#F4FAF9;border-color:var(--teal-line)}
.callout h3{font-size:16px}

/* bridge (contribution walk) */
.bridge{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bridge-row{display:grid;grid-template-columns:200px 1fr 90px;gap:12px;align-items:center;font-size:13px}
.bridge-track{position:relative;height:22px;background:#F4F5F7;border-radius:4px}

function gbp(n, opts = {}) {
  if (n == null || isNaN(n)) return '—';
  const neg = n < 0; const v = Math.abs(n);
  const hasPence = opts.pence || Math.round(v * 100) % 100 !== 0;
  const s = v.toLocaleString('en-GB', { minimumFractionDigits: hasPence ? 2 : 0, maximumFractionDigits: hasPence ? 2 : 0 });
  return (neg ? '−' : (opts.sign && n > 0 ? '+' : '')) + '£' + s;
}

const MONTHS_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const toD = s => new Date(s.length === 10 ? s + 'T00:00:00Z' : s);
function fmtDate(s, long) { if (!s) return '—'; const d = toD(s); return long ? `${DAYS_L[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS_L[d.getUTCMonth()]} ${d.getUTCFullYear()}` : `${DAYS[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; }
function fmtDay(s) { if (!s) return '—'; const d = toD(s); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
const UK_TIME = new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Europe/London' });
const UK_DATE = new Intl.DateTimeFormat('en-CA', { year:'numeric', month:'2-digit', day:'2-digit', timeZone:'Europe/London' });
function fmtTime(iso) { if (!iso) return '—'; return UK_TIME.format(toD(iso)); }
function fmtDT(iso) { if (!iso) return '—'; return fmtDate(iso.length > 10 ? UK_DATE.format(toD(iso)) : iso) + ', ' + fmtTime(iso); }
const hm = min => min == null ? '—' : `${Math.floor(min / 60)}h ${String(min % 60).padStart(2,'0')}m`;
const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / 86400000);
const addMin = (iso, m) => new Date(toD(iso).getTime() + m * 60000).toISOString().replace('.000','');
const initials = n => n.replace(/[^A-Za-z0-9\s]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const r2 = n => Math.round(n * 100) / 100;
const addDays = (d, n) => new Date(toD(d).getTime() + n * 86400000).toISOString().slice(0, 10);
const mondayOf = d => addDays(d, -((toD(d).getUTCDay() + 6) % 7));
function wtdDays() { const out = []; for (let d = WEEK_START; d <= YESTERDAY; d = addDays(d, 1)) out.push(d); return out; }
function wtdLabel() { const d = wtdDays(); return d.length ? (d.length === 1 ? fmtDate(d[0]) : `${fmtDate(d[0])} – ${fmtDate(d[d.length - 1])}`) : 'No completed days yet this week'; }
function dataRange() { const ds = S().jobs.map(j => j.date).sort(); return ds.length ? [ds[0], ds[ds.length - 1]] : [TODAY, TODAY]; }
function positionLabel() { return 'morning position at 07:00'; }
function tenantName() { return 'Trans Haul'; }
const uniq = a => [...new Set(a)];

/* ---------- store ---------- */
const KEY = 'thp.state.v3', POD_KEY = 'thp.pods.v3', SESSION_KEY = 'thp.session.v3';
const Store = {
  state: null, pods: {}, session: null, persistOk: true,
  load() {
    try { const raw = localStorage.getItem(KEY); this.state = raw ? JSON.parse(raw) : null; } catch (e) { this.state = null; }
    if (!this.state || this.state.version !== 3) { this.state = buildSeed(); this.save(); }
    try { this.pods = JSON.parse(localStorage.getItem(POD_KEY) || '{}'); } catch (e) { this.pods = {}; }
    try { this.session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { this.session = null; }
  },
  save() {
    try { localStorage.setItem(KEY, JSON.stringify(this.state)); this.persistOk = true; }
    catch (e) { this.persistOk = false; toast('Browser storage is unavailable — changes will last until this tab closes.', 'err'); }
  },
  savePods() { localStorage.setItem(POD_KEY, JSON.stringify(this.pods)); },
  setSession(s) { this.session = s; try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch (e) {} },
  reset() {
    try { localStorage.removeItem(KEY); localStorage.removeItem(POD_KEY); localStorage.removeItem(SESSION_KEY); } catch (e) {}
    this.state = buildSeed(); this.pods = {}; this.session = null; this.save();
  },
};
const S = () => Store.state;
// Overridden by the live build (src/live.js)
function disclosure() { return { short:'Illustrative demo data', long:' · No live systems connected', title:'All data in this demonstration is illustrative. No live systems are connected.' }; }
function clockLabel() { return `${fmtDate(nowIso().slice(0,10))} · ${fmtTime(nowIso())} GMT (demo clock)`; }
const nowIso = () => S().clock;
function tick(min) { S().clock = addMin(S().clock, min); return S().clock; }
function nextId(prefix) { S().seq += 1; return prefix + '-' + String(S().seq).padStart(3, '0'); }

/* ---------- roles & permissions ---------- */
const ROLE_LABEL = { director:'Director', operations:'Operations Manager', transport:'Transport & Compliance', viewonly:'View Only', driver:'Driver', customer:'Customer Portal' };
const SECTIONS = [
  { id:'overview', label:'Dashboard', icon:'home', href:'#/dashboard' },
  { id:'jobs', label:'Jobs & Margins', icon:'jobs', href:'#/jobs' },
  { id:'operations', label:'Operations', icon:'ops', href:'#/ops/today' },
  { id:'cash', label:'Customers & Cash', icon:'cash', href:'#/cash/debtors' },
  { id:'fleet', label:'Fleet & Compliance', icon:'fleet', href:'#/fleet/vehicles' },
  { id:'admin', label:'Administration', icon:'admin', href:'#/admin/team' },
];
const ROLE_SECTIONS = { director:['overview','jobs','operations','cash','fleet','admin'], operations:['overview','jobs','operations'], transport:['overview','operations','fleet'] };
function me() { const s = Store.session; return s && s.userId ? user(s.userId) : null; }
function myRole() { const s = Store.session; if (!s) return null; if (s.kind === 'customer') return 'customer'; const u = me(); return u ? u.role : null; }
function sectionsFor(u) { if (!u) return []; if (u.role === 'viewonly') return ['overview', ...(u.sections || []).filter(x => x !== 'admin' && x !== 'overview')]; return ROLE_SECTIONS[u.role] || []; }
function can(cap) {
  const u = me(); if (!u) return false; const r = u.role;
  switch (cap) {
    case 'money': return r === 'director' || r === 'operations' || (r === 'viewonly' && !!u.money);
    case 'cash': return r === 'director' || (r === 'viewonly' && !!u.money && (u.sections || []).includes('cash'));
    case 'admin': return r === 'director';
    case 'act': return ['director','operations','transport'].includes(r);
    case 'recharge': return r === 'director' || r === 'operations';
    case 'cover': return ['director','operations','transport'].includes(r);
    case 'compliance': return r === 'director' || r === 'transport';
    case 'share': return r === 'director' || r === 'operations';
    case 'pod': return ['director','operations','transport'].includes(r);
    default: return sectionsFor(u).includes(cap);
  }
}
const hasSection = id => sectionsFor(me()).includes(id);

/* ---------- selectors (all aggregates derive from source records) ---------- */
const threshold = () => S().settings.varianceThresholdPct;
const isDone = j => j.status === 'delivered';
const costVar = j => j.actualCost == null ? null : r2(j.actualCost - j.plannedCost);
const costVarPct = j => j.actualCost == null ? null : (j.actualCost - j.plannedCost) / j.plannedCost * 100;
const isFlagged = j => isDone(j) && j.actualCost != null && costVarPct(j) > threshold();
const plannedContrib = j => j.price - j.plannedCost;
const actualContrib = j => j.actualCost == null ? null : j.price - j.actualCost;

function periodStats(list) {
  const delivered = list.filter(isDone);
  const done = delivered.filter(j => j.actualCost != null);   // costed jobs (cost data may be withheld by role)
  const revenue = sum(done, j => j.price), planned = sum(done, j => j.plannedCost), actual = sum(done, j => j.actualCost);
  return { jobs: delivered.length, revenue, planned, actual, overrun: actual - planned,
    pContrib: revenue - planned, aContrib: revenue - actual,
    pMargin: revenue ? (revenue - planned) / revenue * 100 : null, aMargin: revenue ? (revenue - actual) / revenue * 100 : null,
    late: delivered.filter(j => j.late), onTime: delivered.filter(j => !j.late), flagged: done.filter(isFlagged),
    costPending: list.filter(j => isDone(j) && j.actualCost == null) };
}
const yesterdayStats = () => periodStats(S().jobs.filter(j => j.date === YESTERDAY));
function wtdStats() {
  const list = S().jobs.filter(j => j.date >= WEEK_START && j.date <= YESTERDAY && isDone(j));
  return { planned: sum(list, j => j.plannedCost), actual: sum(list, j => j.actualCost), jobs: list.length,
    byDay: uniq(list.map(j => j.date)).sort().map(d => { const l = list.filter(j => j.date === d); return { date:d, planned:sum(l, j => j.plannedCost), actual:sum(l, j => j.actualCost) }; }) };
}
function podStats() {
  const done = S().jobs.filter(isDone);
  const missing = done.filter(j => j.pod.status === 'missing');
  const uninvoiced = done.filter(j => j.invoice.status === 'pending');
  return { missing, uninvoiced, blocked: uninvoiced.filter(j => j.pod.status !== 'received'), ready: uninvoiced.filter(j => j.pod.status === 'received') };
}
function vehicleAvailable(v, date) {
  if (!v) return false;
  if (v.vorSince && date >= v.vorSince && (!v.vorUntil || date < v.vorUntil)) return false;
  return true;
}
function coverState(j) {
  if (j.subcontract) return 'subcontract';
  const v = vehicle(j.vehicleId);
  if (!vehicleAvailable(v, j.date)) return 'vehicle_unavailable';
  if (j.driverId) return 'confirmed';
  if (j.proposedDriverId) return 'proposed';
  return 'no_driver';
}
function todayStats() {
  const list = S().jobs.filter(j => j.date === TODAY);
  const st = list.map(j => ({ j, c: coverState(j) }));
  const confirmed = st.filter(x => x.c === 'confirmed' || x.c === 'subcontract').length;
  const proposed = st.filter(x => x.c === 'proposed').map(x => x.j);
  const uncovered = st.filter(x => x.c === 'no_driver' || x.c === 'vehicle_unavailable').map(x => x.j);
  return { list, booked: list.length, confirmed, proposed, planned: confirmed + proposed.length, uncovered };
}
function bucketOf(inv) { const a = daysBetween(inv.date, TODAY); return a <= 30 ? 0 : a <= 60 ? 1 : a <= 90 ? 2 : 3; }
const BUCKETS = ['0–30 days', '31–60 days', '61–90 days', '90+ days'];
function debtorStats() {
  const open = S().invoices.filter(i => i.status === 'outstanding');
  const buckets = [0, 1, 2, 3].map(b => sum(open.filter(i => bucketOf(i) === b), i => i.amount));
  const eligibleList = open.filter(i => i.eligible && bucketOf(i) < 3);
  const eligible = sum(eligibleList, i => i.amount);
  const b = S().bibby; const funding = r2(eligible * b.advanceRate);
  const headroom = Math.max(0, Math.min(funding, b.facilityCeiling) - b.drawn);
  return { open, buckets, total: sum(buckets), eligible, funding, headroom, bibby: b };
}
function utilisation(vehicleId) {
  const days = wtdDays();
  const vs = vehicleId ? [vehicle(vehicleId)] : S().vehicles;
  let avail = 0, worked = 0, miles = 0, empty = 0;
  vs.forEach(v => days.forEach(d => {
    if (vehicleAvailable(v, d)) avail++;
    const js = S().jobs.filter(j => j.vehicleId === v.id && j.date === d && isDone(j));
    if (js.length) worked++;
    miles += sum(js, j => j.actualMiles || 0); empty += sum(js, j => j.emptyMiles || 0);
  }));
  return { avail, worked, util: avail ? worked / avail * 100 : null, miles, empty, emptyPct: miles ? empty / miles * 100 : null };
}
const activeRecharges = () => S().recharges.filter(r => r.status === 'draft');
const openDefects = vid => S().defects.filter(d => d.vehicleId === vid && d.status !== 'rectified');
function vehicleStatus(v) {
  if (v.status === 'vor') return { label:'Vehicle Off Road', cls:'bad' };
  const safety = openDefects(v.id).filter(d => d.severity === 'safety');
  if (safety.length) return { label:'Safety defect — not cleared', cls:'bad' };
  if (openDefects(v.id).length) return { label:'Minor defect reported', cls:'warn' };
  const tj = S().jobs.find(j => j.vehicleId === v.id && j.date === TODAY && ['en_route','on_site'].includes(j.status));
  if (tj) return { label:'On the road', cls:'info' };
  return { label:'Available', cls:'ok' };
}
const sharesForJob = id => S().shares.filter(s => s.jobId === id && s.active);
const sharesForContact = id => S().shares.filter(s => s.contactId === id && s.active);
function linkState(l) { if (!l) return 'missing'; if (l.usedAt) return 'used'; if (l.expired || nowIso() > l.expiresAt) return 'expired'; return 'valid'; }

/* ---------- activity log ---------- */
function actor() {
  const s = Store.session;
  if (!s) return { id:'SYSTEM', name:'System', role:'System' };
  if (s.kind === 'customer') { const c = contact(s.contactId); return { id:c.id, name:`${c.name} (${customer(c.customerId).name})`, role:'Customer' }; }
  const u = me(); return { id:u.id, name:u.name, role:ROLE_LABEL[u.role] };
}
function log(action, recordType, recordId, prev, next, extra = {}) {
  const a = actor();
  S().activity.unshift(Object.assign({ t: nowIso(), actorId:a.id, actorName:a.name, actorRole:a.role, action, recordType, recordId, prev: prev == null ? '—' : String(prev), next: next == null ? '—' : String(next) }, extra));
}
function actorLabel(e) {
  if (e.actorName) return { name:e.actorName, role:e.actorRole };
  if (e.actorId === 'SYSTEM') return { name:'System (simulated)', role:'System' };
  const u = user(e.actorId); return u ? { name:u.name, role:ROLE_LABEL[u.role] } : { name:e.actorId, role:'' };
}
const stripMoney = s => String(s).replace(/[−+-]?£\s?[\d,]+(\.\d+)?/g, '[amount restricted]');
const safeText = s => can('money') ? s : stripMoney(s);

/* ---------- services (state-changing; each logs activity) ---------- */
const Svc = {
  draftRecharge(jobId, amount, note) {
    const j = job(jobId);
    if (!j || !j.recharge) throw new Error('This job has no identified recharge opportunity.');
    if (activeRecharges().some(r => r.jobId === jobId)) throw new Error('A draft recharge already exists for ' + jobId + '.');
    amount = Number(amount);
    if (!(amount > 0)) throw new Error('Enter a recharge amount greater than zero.');
    if (amount > j.recharge.amount) throw new Error(`Amount cannot exceed the evidenced recharge candidate of ${gbp(j.recharge.amount)}.`);
    tick(2);
    const r = { id: nextId('RCH'), jobId, customerId: j.customerId, amount, note: note || j.recharge.basis, status:'draft', createdBy: me().id, createdAt: nowIso(), history: [] };
    S().recharges.push(r);
    log('Drafted recharge', 'job', jobId, 'No draft', `Draft ${gbp(amount)} (not invoiced)`, { money: true });
    Store.save(); return r;
  },
  editRecharge(id, note) {
    const r = byId(S().recharges, id); tick(1);
    const prev = r.note; r.note = note; r.history.push({ t: nowIso(), by: me().id, change:'Note edited' });
    log('Edited recharge note', 'job', r.jobId, prev.slice(0, 60), note.slice(0, 60)); Store.save();
  },
  cancelRecharge(id) {
    const r = byId(S().recharges, id); tick(1); r.status = 'cancelled'; r.history.push({ t: nowIso(), by: me().id, change:'Cancelled' });
    log('Cancelled recharge draft', 'job', r.jobId, `Draft ${gbp(r.amount)}`, 'Cancelled', { money: true }); Store.save();
  },
  restoreRecharge(id) {
    const r = byId(S().recharges, id);
    if (activeRecharges().some(x => x.jobId === r.jobId)) throw new Error('Another draft already exists for this job.');
    tick(1); r.status = 'draft'; r.history.push({ t: nowIso(), by: me().id, change:'Restored' });
    log('Restored recharge draft', 'job', r.jobId, 'Cancelled', `Draft ${gbp(r.amount)}`, { money: true }); Store.save();
  },
  coverCheck(jobId, driverId) {
    const j = job(jobId), d = driver(driverId);
    if (!d) return { ok:false, msg:'Select a driver.' };
    if (d.todayState !== 'available') return { ok:false, msg:`${d.id} is not available today (${d.todayState === 'allocated' ? 'already allocated' : 'rest day or leave'}).` };
    if (d.hoursAvailMin < j.requiredMin) return { ok:false, msg:`${d.id} has an estimated ${hm(d.hoursAvailMin)} available. This job needs an illustrative ${hm(j.requiredMin)}, so ${d.id} is not planning-eligible.` };
    return { ok:true };
  },
  proposeCover(jobId, driverId) {
    const chk = this.coverCheck(jobId, driverId); if (!chk.ok) throw new Error(chk.msg);
    const j = job(jobId); tick(3);
    j.proposedDriverId = driverId; j.proposedBy = me().id; j.proposedAt = nowIso();
    driver(driverId).todayState = 'proposed';
    log('Proposed driver cover', 'job', jobId, 'No driver', `${driverId} proposed — awaiting Vigo confirmation`);
    Store.save();
  },
  withdrawCover(jobId) {
    const j = job(jobId); const d = j.proposedDriverId; tick(1);
    driver(d).todayState = 'available'; j.proposedDriverId = null;
    log('Withdrew proposed cover', 'job', jobId, `${d} proposed`, 'No driver'); Store.save();
  },
  raiseAction(a) {
    if (!a.title || !a.title.trim()) throw new Error('Give the action a short title.');
    if (!a.ownerId) throw new Error('Choose an owner.');
    tick(2);
    const x = Object.assign({ id: nextId('ACT'), status:'open', createdBy: me().id, createdAt: nowIso(), progress: [] }, a);
    S().actions.unshift(x);
    log('Raised action', x.recordType || 'action', x.recordId || x.id, '—', `${x.title} · owner ${user(x.ownerId).name} · ${x.priority}`);
    Store.save(); return x;
  },
  addProgress(id, note) {
    if (!note.trim()) throw new Error('Write a short progress note.');
    const a = byId(S().actions, id); tick(1);
    a.progress.push({ t: nowIso(), by: me().id, note });
    log('Recorded action progress', a.recordType || 'action', a.recordId || a.id, a.title, note.slice(0, 80)); Store.save();
  },
  completeAction(id, note) {
    const a = byId(S().actions, id); tick(1);
    a.status = 'done'; a.completedAt = nowIso(); a.completedBy = me().id;
    if (note) a.progress.push({ t: nowIso(), by: me().id, note });
    log('Completed action', a.recordType || 'action', a.recordId || a.id, 'Open', 'Completed — ' + a.title); Store.save();
  },
  reopenAction(id) { const a = byId(S().actions, id); tick(1); a.status = 'open'; log('Reopened action', a.recordType || 'action', a.recordId || a.id, 'Completed', 'Open'); Store.save(); },
  recordFollowUp(cmpId, f) {
    if (!f.note || !f.note.trim()) throw new Error('Describe the follow-up that took place.');
    const c = byId(S().compliance, cmpId); tick(4);
    const prev = c.status;
    c.history.push({ t: nowIso(), by: me().id, note: f.note, method: f.method, next: f.nextDate });
    c.status = 'followup'; c.followUpAt = nowIso(); c.followUpBy = me().id; c.nextReview = f.nextDate || null;
    if (c.driverId) { const d = driver(c.driverId); if (c.kind === 'licence') d.licenceStatus = 'followup'; if (c.kind === 'tacho') d.tachoStatus = 'followup'; }
    log('Recorded compliance follow-up', c.driverId ? 'driver' : 'vehicle', c.driverId || c.vehicleId, statusLabel(prev), 'Follow-up recorded (internal record)');
    Store.save();
  },
  submitWalkaround(jobId, vehicleId, results) {
    tick(6);
    const w = { id: nextId('WLK'), jobId, vehicleId, driverId: me().driverId, at: nowIso(), results, defects: [] };
    results.filter(r => r.result === 'defect').forEach(r => {
      const d = { id: nextId('DEF'), vehicleId, item: r.item, severity: r.severity, note: r.note || '', reportedBy: me().driverId, reportedAt: nowIso(), status:'open', source:'Driver app walkaround', history: [] };
      S().defects.unshift(d); w.defects.push(d.id);
      log('Reported vehicle defect', 'vehicle', vehicleId, 'No open defect', `${d.severity === 'safety' ? 'Safety-critical' : 'Minor'}: ${d.item}`);
    });
    S().walkarounds.unshift(w);
    const j = job(jobId); j.checkins.push({ stage:'walkaround', at: nowIso(), by: me().driverId, note: w.defects.length ? `${w.defects.length} defect(s) reported` : 'No defects' });
    log('Completed walkaround check', 'vehicle', vehicleId, '—', w.defects.length ? `Completed with ${w.defects.length} defect(s) — not cleared` : 'Completed — no defects');
    Store.save(); return w;
  },
  resolveDefect(defId, note) {
    if (!note.trim()) throw new Error('Record what was done to rectify or assess the defect.');
    const d = byId(S().defects, defId); tick(3);
    const prev = d.status; d.status = 'rectified'; d.history.push({ t: nowIso(), by: me().id, note });
    const v = vehicle(d.vehicleId);
    if (prev === 'vor' && !S().defects.some(x => x.vehicleId === v.id && x.status === 'vor')) { v.status = 'available'; v.vorUntil = TODAY; }
    log('Recorded defect rectification', 'vehicle', d.vehicleId, prev === 'vor' ? 'VOR' : 'Open defect', 'Rectified — ' + note.slice(0, 60)); Store.save();
  },
  checkin(jobId, stage) {
    const j = job(jobId);
    const mins = { depart:10, arrive:75, unloading:8, complete:40 }[stage] || 2;
    tick(mins);
    const prev = j.status;
    j.checkins.push({ stage, at: nowIso(), by: me().driverId });
    if (stage === 'depart') { j.status = 'en_route'; j.eta = addMin(nowIso(), 75); }
    if (stage === 'arrive') j.status = 'on_site';
    if (stage === 'complete') {
      j.status = 'delivered'; j.deliveredAt = fmtTime(nowIso()); j.late = fmtTime(nowIso()) > j.slot;
      j.pod = { status:'missing' }; j.invoice = { status:'pending' };
      j.actualCost = null; j.costPending = true;
    }
    log('Driver check-in: ' + STAGE_LABEL[stage], 'job', jobId, statusLabel(prev), statusLabel(j.status));
    if (stage === 'complete') this.notifyDelivery(j);
    Store.save();
  },
  undoCheckin(jobId) {
    const j = job(jobId); const u = lastUndo(j);
    if (!u) throw new Error('This step can no longer be undone here — contact the transport office.');
    tick(1); const prev = j.status;
    j.checkins.splice(j.checkins.lastIndexOf(u), 1);
    if (u.stage === 'depart') { j.status = 'not_started'; j.eta = null; }
    if (u.stage === 'arrive') j.status = 'en_route';
    if (u.stage === 'complete') {
      j.status = 'on_site'; j.deliveredAt = null; j.late = null; j.pod = { status:'n/a' }; j.invoice = { status:'not_due' }; j.costPending = false;
      const cancelled = S().emails.filter(e => e.jobId === jobId && e.kind === 'delivery' && e.at >= u.at);
      S().emails = S().emails.filter(e => !cancelled.includes(e));
      S().links = S().links.filter(l => !(cancelled.some(e => e.token === l.token) && !l.usedAt));
      if (cancelled.length) log('Delivery notification cancelled', 'job', jobId, 'Queued', 'Cancelled before sending (check-in undone)');
    }

const STAGE_LABEL = { walkaround:'Walkaround check', depart:'Departed depot', arrive:'Arrived at customer', unloading:'Unloading started', complete:'Delivery complete', pod:'POD uploaded' };

function deliveryPill(j) {

  if (j.status === 'en_route') return `<span class="pill info">En route</span>`;

}

/* ---------- toast & modal ---------- */
function toast(msg, kind) {

  if (!box) { box = document.createElement('div'); box.className = 'toasts'; box.setAttribute('role', 'status'); document.body.appendChild(box); }
  if (window.innerWidth < 760) box.querySelectorAll('.toast').forEach(x => x.remove());   // phones: one message at a time

}
const Modal = {
  el: null, onSubmit: null, lastFocus: null,
  open({ title, sub, body, foot, wide, onSubmit, onOpen }) {
    this.close();
    this.lastFocus = document.activeElement;
    const back = document.createElement('div'); back.className = 'modal-back';
    back.innerHTML = `<form class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="m-title" novalidate>
      <div class="modal-head"><div><h2 id="m-title">${esc(title)}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
      <button type="button" class="btn btn-ghost btn-sm" data-act="modalClose" aria-label="Close">${icon('x')}</button></div>
      <div class="modal-body">${body}</div>${foot != null ? `<div class="modal-foot">${foot}</div>` : ''}</form>`;
    document.body.appendChild(back); this.el = back; this.onSubmit = onSubmit;
    back.addEventListener('mousedown', e => { if (e.target === back) this.close(); });
    back.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault(); if (!this.onSubmit) return;
      const btn = e.target.querySelector('button[type=submit]'); if (btn) { if (btn.disabled) return; btn.disabled = true; }
      try { await this.onSubmit(new FormData(e.target), e.target); } catch (err) { this.error(err.message); } finally { if (btn && btn.isConnected) btn.disabled = false; }
    });
    const f = back.querySelector('input:not([type=hidden]):not([disabled]),textarea,select,button.btn-primary'); if (f) setTimeout(() => f.focus(), 30);
    if (onOpen) onOpen(back);
  },
  error(msg) { const box = this.el && this.el.querySelector('.m-err'); if (box) { box.textContent = msg; box.hidden = false; } else toast(msg, 'err'); },
  close() { if (this.el) { this.el.remove(); this.el = null; if (this.lastFocus && this.lastFocus.focus) this.lastFocus.focus(); } },
};

/* ---------- table builder ---------- */
function table({ cols, rows, rowAttr, foot, sort, sortKey, cards = true, empty }) {
  if (!rows.length) return empty || `<div class="empty"><h4>No matching records</h4><p>Try widening the date range or clearing a filter.</p></div>`;
  const th = cols.map(c => {
    const sortable = c.sort && sortKey;
    const arrow = sortable && sort && sort.key === c.key ? (sort.dir === 'asc' ? '↑' : '↓') : '';
    return `<th class="${c.num ? 'num' : ''} ${sortable ? 'sortable' : ''}" ${sortable ? `data-act="sort" data-table="${sortKey}" data-key="${c.key}" tabindex="0" aria-sort="${arrow ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}"` : ''}>${esc(c.label)}${arrow ? `<span class="arr">${arrow}</span>` : ''}</th>`;
  }).join('');
  const body = rows.map(r => `<tr ${rowAttr ? rowAttr(r) : ''}>${cols.map((c, i) => `<td class="${c.num ? 'num' : ''} ${i === 0 ? 'cell-main' : ''} ${c.cls || ''}" data-label="${esc(c.label)}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('');
  const tf = foot ? `<tfoot><tr>${cols.map((c, i) => `<td class="${c.num ? 'num' : ''} ${i === 0 ? 'cell-main' : ''}" data-label="${esc(c.label)}">${foot[c.key] != null ? foot[c.key] : ''}</td>`).join('')}</tr></tfoot>` : '';
  return `<div class="table-wrap ${cards ? 'cards-wrap-m' : ''}"><table class="data ${cards ? 'cards' : ''}"><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${tf}</table></div>`;
}
function sortRows(rows, sort, getters) {
  if (!sort || !sort.key) return rows;
  const g = getters[sort.key] || (r => r[sort.key]);
  const d = sort.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => { const x = g(a), y = g(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * d; });
}

  const csv = [header.map(q).join(','), ...rows.map(r => r.map(q).join(','))].join('\r\n');
  const blob = new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  log('Exported CSV', 'export', name, '—', `${rows.length} rows (${can('money') ? 'with' : 'without'} financial columns)`); Store.save();

}

function kcard(o) {

function dsec(n, title, sub, link, cards, cols) {

function wtdChart(w) {
  const W = 300, H = 112, max = Math.max(...w.byDay.map(d => Math.max(d.planned, d.actual))) * 1.08;
  const gw = W / w.byDay.length, bw = 26, base = H - 22;
  const bars = w.byDay.map((d, i) => {
    const x = i * gw + gw / 2, hp = d.planned / max * (base - 16), ha = d.actual / max * (base - 16), over = d.actual > d.planned;
    return `<rect x="${x - bw - 2}" y="${base - hp}" width="${bw}" height="${hp}" rx="3" class="bp"/><rect x="${x + 2}" y="${base - ha}" width="${bw}" height="${ha}" rx="3" class="${over ? 'bo' : 'ba'}"/>
      <text x="${x}" y="${H - 6}" text-anchor="middle" class="ax">${fmtDate(d.date).split(' ')[0]}</text><text x="${x + 2 + bw / 2}" y="${base - ha - 5}" text-anchor="middle" class="vl">${over ? '+' : ''}${gbp(d.actual - d.planned).replace('£', '£')}</text>`;
  }).join('');
  return `<svg class="mchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Planned versus actual cost by day, Monday to Wednesday"><line x1="0" x2="${W}" y1="${base}" y2="${base}" class="gl"/>${bars}</svg>
    <div class="legend sm"><span><i class="lg-p"></i>Planned</span><span><i class="lg-a"></i>Actual</span><span><i class="lg-o"></i>Over plan</span></div>`;
}

function filteredJobs() {

  if (q) list = list.filter(j => [j.id, custName(j.customerId), j.dest, j.vehicleId, j.driverId, j.proposedDriverId, j.customerRef].some(x => String(x || '').toLowerCase().includes(q)));
  if (f.customer) list = list.filter(j => j.customerId === f.customer);
  if (f.vehicle) list = list.filter(j => j.vehicleId === f.vehicle);
  if (f.driver) list = list.filter(j => j.driverId === f.driver || j.proposedDriverId === f.driver);

      <tr><td>Total job cost per pallet</td><td class="num">${gbp(j.plannedCost / j.pallets, { pence:true })}</td><td class="num">${gbp(j.actualCost / j.pallets, { pence:true })}</td></tr>

  const reasons = j.variance.length ? `<div class="card"><div class="card-head"><h3>Why cost moved from plan</h3><span class="small muted">${gbp(v, { sign:true })} total</span></div>${table({ cards:false, cols:[{ key:'reason', label:'Reason' }, { key:'amount', label:'Amount', num:true, render: x => gbp(x.amount, { sign:true }) }, { key:'share', label:'Share', num:true, render: x => pct(x.amount / v * 100, 0) }], rows:j.variance, foot:{ reason:'<b>Total cost variance</b>', amount: gbp(sum(j.variance, x => x.amount), { sign:true }), share:'100%' } })}</div>` : '';

    : `<div class="callout good mb16"><div><span class="tag">On plan</span><h3 class="mt8">${ac > pc ? gbp(ac - pc) + ' above' : 'In line with'} planned contribution</h3></div></div>`;

/* ---------- COST MODEL analysis (Jobs & Margins tab) ---------- */
function viewCostModel() {
  const per = UI.modelPeriod, grp = UI.modelGroup;
  const range = { yesterday:[YESTERDAY, YESTERDAY], wtd:[WEEK_START, YESTERDAY], all:[dataRange()[0], YESTERDAY] }[per];
  const js = S().jobs.filter(j => j.date >= range[0] && j.date <= range[1] && isDone(j) && j.actualCost != null);
  const weekOf = d => 'w/c ' + fmtDay(mondayOf(d));
  const key = { job: j => j.id, customer: j => custName(j.customerId), driver: j => j.driverId || 'Subcontract', vehicle: j => j.vehicleId ? `${j.vehicleId} · ${vehicle(j.vehicleId).type}` : 'Subcontract', week: j => weekOf(j.date) }[grp];
  const groups = {}; js.forEach(j => { const k = key(j); (groups[k] = groups[k] || []).push(j); });
  const rows = Object.entries(groups).map(([k, l]) => { const own = l.filter(j => !j.subcontract); const miles = sum(own, j => j.actualMiles), pal = sum(own, j => j.pallets || 0); const rev = sum(l, j => j.price), pc = sum(l, j => j.plannedCost), ac = sum(l, j => j.actualCost); return { k, l, n:l.length, rev, pc, ac, con: rev - ac, m: rev ? (rev - ac) / rev * 100 : null, cpm: miles ? sum(own, j => j.actualCost) / miles : null, cpp: pal ? sum(own, j => j.actualCost) / pal : null, v: ac - pc }; }).sort((a, b) => b.v - a.v || b.rev - a.rev);
  const cats = {}; js.forEach(j => j.variance.forEach(v => { cats[v.cat] = (cats[v.cat] || 0) + v.amount; }));
  const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]); const cmax = Math.max(1, ...catRows.map(c => Math.abs(c[1])));

function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Choose an image file (JPEG or PNG).'));
    if (file.size > 15 * 1024 * 1024) return rej(new Error('That image is over 15 MB. Choose a smaller photo.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('The image could not be read.'));
    fr.onload = () => { const img = new Image(); img.onload = () => { const max = 1100, k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const url = c.toDataURL('image/jpeg', 0.72); res({ dataUrl: url, name: file.name, size: Math.round(url.length * 0.75) }); }; img.onerror = () => rej(new Error('The image could not be opened.')); img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

  walkaround: async (form, fd) => {
    const results = WALK_ITEMS.map((it, i) => ({ item: it, result: fd.get('r' + i), severity: fd.get('sev' + i), note: (fd.get('note' + i) || '').trim() }));
    const unanswered = results.filter(r => !r.result);
    if (unanswered.length) return toast(`Check every item before submitting — ${unanswered.length} still to mark (first: ${unanswered[0].item}).`, 'err');
    const bad = results.find(r => r.result === 'defect' && !r.note);
    if (bad) return toast(`Describe the defect for “${bad.item}”.`, 'err');
    const j = job(form.dataset.id); const w = await Svc.submitWalkaround(j.id, j.vehicleId, results);
    const safety = results.some(r => r.result === 'defect' && r.severity === 'safety');
    toast(w.defects.length ? (safety ? 'Safety-critical defect sent to the transport office. Do not depart.' : 'Walkaround submitted with a minor defect reported') : 'Walkaround complete — no defects');
    go('#/driver-app');
  },
  rates: async (form, fd) => {
    const cur = S().rateCards[S().rateCards.length - 1].rates; const r = {};
    for (const k of Object.keys(cur)) { const v = Number(fd.get(k)); if (!(v >= 0) || fd.get(k) === '') return toast('Every rate needs a number of zero or more.', 'err'); r[k] = v; }
    if (Object.keys(cur).every(k => cur[k] === r[k])) return toast('No rates have changed.', 'err');
    await Svc.publishRates(r, (fd.get('note') || '').trim()); toast('New rate card version published — completed jobs keep their snapshots'); rerender();
  },
  threshold: async (form, fd) => { try { await Svc.setThreshold(fd.get('thr')); toast(`Threshold set to ${threshold()}% — ${S().jobs.filter(isFlagged).length} jobs flagged`); rerender(); } catch (e) { toast(e.message, 'err'); } },
  custFind: async (form, fd) => { const ref = (fd.get('ref') || '').trim().toUpperCase(); if (!ref) return; const sh = custShares().find(s => s.jobId.toUpperCase() === ref || (job(s.jobId).customerRef || '').toUpperCase() === ref); go('#/portal/job/' + encodeURIComponent(sh ? sh.jobId : ref)); },
};
function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && !el.disabled && !el.classList.contains('is-disabled')) {
      const fn = ACT[el.dataset.act]; if (!fn) return;
      if (el.tagName === 'A' || el.tagName === 'BUTTON' || el.tagName === 'TR' || el.tagName === 'TH') e.preventDefault();
      Promise.resolve().then(() => fn(el, e)).catch(err => { toast(err.message, 'err'); console.error(err); });
      return;
    }
    if (e.target.closest('a.is-disabled')) { e.preventDefault(); return; }
    const res = document.getElementById('gsearch-res');
    if (res && !e.target.closest('.search')) res.hidden = true;
    if (UI.navOpen && e.target.closest('.shell') && !e.target.closest('.sidebar')) { UI.navOpen = false; document.querySelector('.shell').classList.remove('nav-open'); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (Modal.el) Modal.close(); const r = document.getElementById('gsearch-res'); if (r) r.hidden = true; }
    if (e.key === 'Enter' || e.key === ' ') { const el = e.target.closest('tr[data-act], th[data-act]'); if (el && e.target === el) { e.preventDefault(); ACT[el.dataset.act](el, e); } }
    if (e.key === 'Enter' && e.target.id === 'gsearch') { const a = document.querySelector('#gsearch-res .sr-item'); if (a) { e.preventDefault(); location.hash = a.getAttribute('href'); } }
  });
  document.addEventListener('input', e => {
    const b = e.target.dataset.bind;
    if (b) { if (b === 'sort') { const [k, d] = e.target.value.split(':'); UI.jobs.sort = { key:k, dir:d }; } else UI.jobs[b] = e.target.value; saveUI(); renderJobsResults(); return; }
    const a = e.target.dataset.actInput; if (a && INPUT[a]) INPUT[a](e.target);
  });
  document.addEventListener('change', e => { const a = e.target.dataset.actChange; if (a && CHANGE[a]) Promise.resolve().then(() => CHANGE[a](e.target)).catch(err => toast(err.message, 'err')); });
  document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); Promise.resolve().then(() => FORMS[f.dataset.form](f, new FormData(f))).catch(err => toast(err.message, 'err')); });
  window.addEventListener('hashchange', () => { Modal.close(); UI.navOpen = false; onRoute(); });
  window.addEventListener('storage', e => { if (e.key === KEY) { Store.load(); rerender(); } });
}

/* ---------- self-test: reconciles the canonical figures against source rows ---------- */
function selfTest() {
  const y = yesterdayStats(), w = wtdStats(), p = podStats(), d = debtorStats(), t = todayStats(), u = utilisation();
  const checks = [
    ['20 delivered', y.jobs === 20], ['18 on time', y.onTime.length === 18], ['2 late (TH-001, TH-003)', y.late.map(j => j.id).join() === 'TH-001,TH-003'],
    ['Revenue £16,490', y.revenue === 16490], ['Planned cost £10,475', y.planned === 10475], ['Actual cost £11,110', y.actual === 11110],
    ['Overrun £635', y.overrun === 635], ['Planned contribution £6,015', y.pContrib === 6015], ['Actual contribution £5,380', y.aContrib === 5380],
    ['Planned margin 36.48%', y.pMargin.toFixed(2) === '36.48'], ['Actual margin 32.63%', y.aMargin.toFixed(2) === '32.63'],
    ['3 flagged at 10%', threshold() !== 10 || S().jobs.filter(isFlagged).map(j => j.id).join() === 'TH-001,TH-002,TH-003'],
    ['WTD planned £31,225', w.planned === 31225], ['WTD actual £32,120', w.actual === 32120],
    ['Debtors £98,000', d.total === 98000], ['Buckets 28/43/18/9k', d.buckets.join() === '28000,43000,18000,9000'], ['Eligible £80,000', d.eligible === 80000], ['Headroom £17,000', d.headroom === 17000],
    ['Utilisation 49/52', u.worked === 49 && u.avail === 52], ['Miles 9,860 / empty 1,240', u.miles === 9860 && u.empty === 1240],
    ['21 booked today', t.booked === 21],
    ['Cost lines reconcile', S().jobs.filter(j => j.miles != null && isDone(j)).every(j => { const l = costLines(j); return Math.abs(sum(l.planned, x => x.amt) - j.plannedCost) < 0.01 && Math.abs(sum(l.actual, x => x.amt) - j.actualCost) < 0.01; })],
    ['Variance reasons reconcile', S().jobs.filter(j => isDone(j) && j.actualCost != null).every(j => Math.abs(sum(j.variance, v => v.amount) - (j.actualCost - j.plannedCost)) < 0.01)],
  ];
  const fails = checks.filter(c => !c[1]);
  window.__selfTest = { passed: checks.length - fails.length, failed: fails.map(c => c[0]) };
  if (fails.length) console.warn('Data self-test failures:', fails.map(c => c[0])); else console.info(`Data self-test: ${checks.length}/${checks.length} reconciliation checks passed`);
  return window.__selfTest;
}

/* ---------- boot ---------- */
(function boot() {
  if (window.THP_CONFIG && window.THP_CONFIG.mode === 'live') return;
  Store.load();
  bindEvents();
  if (!location.hash) location.replace(Store.session ? '#/dashboard' : '#/signin');
  render();
  selfTest();
})();

</script>
